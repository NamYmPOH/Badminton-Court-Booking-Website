<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="isoBg-52" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="isoGlow-52" cx="45%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="matIso-52" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#isoBg-52)" />
  <rect width="800" height="450" fill="url(#isoGlow-52)" />

  <!-- Stadium Hall Structure -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="50" y1="120" x2="400" y2="30" />
    <line x1="400" y1="30" x2="750" y2="120" />
    <line x1="400" y1="30" x2="400" y2="180" />
  </g>

  <!-- Isometric Court Floor -->
  <!-- Outer Floor Surround -->
  <polygon points="400,90 730,220 400,410 70,280" fill="#0f172a" stroke="#1e293b" stroke-width="3" />

  <!-- Main Playing Surface (Isometric Diamond) -->
  <polygon points="400,120 680,230 400,380 120,270" fill="url(#matIso-52)" stroke="#ffffff" stroke-width="2.5" />

  <!-- Singles Sidelines -->
  <polygon points="400,135 650,230 400,365 150,270" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.9" />

  <!-- Short Service Lines -->
  <line x1="330" y1="195" x2="470" y2="250" stroke="#ffffff" stroke-width="1.8" />
  <line x1="470" y1="250" x2="330" y2="305" stroke="#ffffff" stroke-width="1.8" />
  <line x1="330" y1="305" x2="190" y2="250" stroke="#ffffff" stroke-width="1.8" />
  <line x1="190" y1="250" x2="330" y2="195" stroke="#ffffff" stroke-width="1.8" />

  <!-- Center service line -->
  <line x1="400" y1="135" x2="400" y2="225" stroke="#ffffff" stroke-width="1.8" />
  <line x1="400" y1="275" x2="400" y2="365" stroke="#ffffff" stroke-width="1.8" />

  <!-- Isometric Net -->
  <g>
    <!-- Left net post -->
    <rect x="250" y="200" width="5" height="45" fill="#64748b" transform="skewY(18)" />
    <!-- Right net post -->
    <rect x="545" y="320" width="5" height="45" fill="#64748b" transform="skewY(18)" />
    <!-- Net Body (Isometric mesh) -->
    <polygon points="255,200 545,315 545,345 255,230" fill="#0f172a" fill-opacity="0.65" stroke="#94a3b8" stroke-width="0.8" />
    <!-- White Top tape -->
    <polygon points="255,198 547,314 547,202 255,198" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- Action Elements: High Flight Shuttlecock & Shadow -->
  <g>
    <!-- Floor Shadow -->
    <ellipse cx="460" cy="330" rx="14" ry="6" fill="#000000" opacity="0.4" />
    <!-- Flying Shuttlecock -->
    <g transform="translate(440, 240) rotate(-40) scale(1.1)">
      <polygon points="-12,-8 12,-8 6,8 -6,8" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="0" cy="11" r="5.5" fill="#fbbf24" stroke="#94a3b8" stroke-width="0.6" />
      <!-- Motion speed lines -->
      <line x1="-2" y1="-12" x2="-2" y2="-24" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.8" />
      <line x1="5" y1="-10" x2="10" y2="-22" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.8" />
    </g>
  </g>

  <!-- Court Identifier Cards -->
  <g transform="translate(30, 30)">
    <rect width="210" height="44" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="22" r="14" fill="#2563eb" />
    <text x="28" y="27" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">52</text>
    <text x="52" y="19" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">SÂN ĐẤU TIÊU CHUẨN 52</text>
    <text x="52" y="34" font-family="Arial, sans-serif" font-size="10" fill="#38bdf8">YONEX FRENCH OPEN BLUE</text>
  </g>
</svg>