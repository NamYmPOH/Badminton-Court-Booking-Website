<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="topHall-28" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="topMat-28" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>

  <!-- Surround Hall Floor -->
  <rect width="800" height="450" fill="url(#topHall-28)" />

  <!-- Outer Safe Margin Zone -->
  <rect x="70" y="45" width="660" height="360" rx="8" fill="#022c22" stroke="#334155" stroke-width="2" />

  <!-- Main Playing Court (BWF Official Dimension Proportions) -->
  <!-- 13.4m x 6.1m (approx ratio 2.2:1) -->
  <rect x="130" y="80" width="540" height="290" fill="url(#topMat-28)" stroke="#fef08a" stroke-width="3" />

  <!-- Singles Sidelines (0.46m inside each side) -->
  <line x1="130" y1="104" x2="670" y2="104" stroke="#fef08a" stroke-width="2" />
  <line x1="130" y1="346" x2="670" y2="346" stroke="#fef08a" stroke-width="2" />

  <!-- Long Service Lines for Doubles (0.76m inside each baseline) -->
  <line x1="165" y1="80" x2="165" y2="370" stroke="#fef08a" stroke-width="2" />
  <line x1="635" y1="80" x2="635" y2="370" stroke="#fef08a" stroke-width="2" />

  <!-- Short Service Lines (1.98m from net) -->
  <line x1="315" y1="80" x2="315" y2="370" stroke="#fef08a" stroke-width="2.5" />
  <line x1="485" y1="80" x2="485" y2="370" stroke="#fef08a" stroke-width="2.5" />

  <!-- Center Service Lines -->
  <line x1="130" y1="225" x2="315" y2="225" stroke="#fef08a" stroke-width="2" />
  <line x1="485" y1="225" x2="670" y2="225" stroke="#fef08a" stroke-width="2" />

  <!-- Center Net Line & Posts -->
  <line x1="400" y1="68" x2="400" y2="382" stroke="#ffffff" stroke-width="4" />
  <circle cx="400" cy="74" r="5" fill="#f59e0b" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="400" cy="376" r="5" fill="#f59e0b" stroke="#1e293b" stroke-width="1.5" />

  <!-- Umpire Chair at Net -->
  <g transform="translate(385, 388)">
    <rect width="30" height="18" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="1" />
    <text x="15" y="13" font-family="Arial, sans-serif" font-size="8" fill="#f8fafc" text-anchor="middle" font-weight="bold">TRỌNG TÀI</text>
  </g>

  <!-- Big Court Number Watermark Center Court -->
  <text x="270" y="245" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" fill-opacity="0.12" text-anchor="middle">COURT</text>
  <text x="530" y="245" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" fill-opacity="0.12" text-anchor="middle">28</text>

  <!-- Top bar header -->
  <g transform="translate(30, 15)">
    <text x="0" y="16" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">SÂN 28 — BWF CERTIFIED MAT</text>
  </g>
</svg>